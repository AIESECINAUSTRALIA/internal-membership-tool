services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Host port 5433 to avoid clashing with a local Postgres on 5432.
    # Inside the compose network the port is still 5432 (see DATABASE_URL).
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]        # venv lives at /opt/venv, outside the mount
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:                        # only browser-safe vars, not the whole .env
      VITE_API_URL: ${VITE_API_URL}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules              # keep the container's node_modules
    depends_on: [backend]

volumes:
  pgdata:
